<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sign in to Fieldcast as an employee or manager." />
    <title>Sign in | Fieldcast</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="/landing/" aria-label="Fieldcast home">
          <span class="brand-mark" aria-hidden="true">W</span>
          <span>Fieldcast</span>
        </a>
        <a class="login-button" href="/landing/">Back to home</a>
      </header>

      <main class="login-content">
        <section class="content-card login-card" aria-labelledby="login-title">
          <p class="eyebrow">EMPLOYEE &amp; MANAGER ACCESS</p>
          <h1 id="login-title">Sign in to Fieldcast</h1>
          <p class="page-description">Enter your six-digit employee ID to open your employee portal or manager dashboard.</p>
          <form class="login-form" id="login-form">
            <label for="user-id">Six-digit ID</label>
            <input
              id="user-id"
              name="userId"
              type="text"
              autocomplete="username"
              inputmode="numeric"
              pattern="[0-9]{6}"
              maxlength="6"
              placeholder="Employee or admin ID"
              required
            />
            <p class="form-feedback" id="login-feedback" role="status" aria-live="polite"></p>
            <button class="login-submit" type="submit">Continue</button>
          </form>
        </section>
      </main>
      <footer class="app-footer"><span class="footer-dot"></span> FIELDCAST</footer>
    </div>
    <script src="./login.js" defer></script>
  </body>
</html>
